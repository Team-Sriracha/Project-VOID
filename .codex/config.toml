# oh-my-codex top-level settings (must be before any [table])
notify = ["node", "/usr/lib/node_modules/oh-my-codex/dist/scripts/notify-hook.js"]
model_reasoning_effort = "xhigh"
developer_instructions = "You have oh-my-codex installed. AGENTS.md is your orchestration brain and the main orchestration surface. Use /prompts:<role> and spawned role prompts for specialized subagent work. Codex native subagents are available via .codex/agents and may be used for independent parallel subtasks within a single session or team pane. Skills are loaded from installed SKILL.md files under .codex/skills, not from native agent TOMLs. Use workflow skills via $name when explicitly invoked or clearly routed by AGENTS.md. Treat role prompts as narrower execution surfaces under AGENTS.md authority."
model = "gpt-5.4"
model_context_window = 1000000
model_auto_compact_token_limit = 900000
service_tier = "fast"

[features]
multi_agent = true
child_agents_md = true

[env]
USE_OMX_EXPLORE_CMD = "1"

[agents]
max_threads = 6
max_depth = 2

# ============================================================
# oh-my-codex (OMX) Configuration
# Managed by omx setup - manual edits preserved on next setup
# ============================================================

# OMX State Management MCP Server
[mcp_servers.omx_state]
command = "node"
args = ["/usr/lib/node_modules/oh-my-codex/dist/mcp/state-server.js"]
enabled = true
startup_timeout_sec = 5

[mcp_servers.omx_state.tools.state_write]
approval_mode = "approve"

# OMX Project Memory MCP Server
[mcp_servers.omx_memory]
command = "node"
args = ["/usr/lib/node_modules/oh-my-codex/dist/mcp/memory-server.js"]
enabled = true
startup_timeout_sec = 5

[mcp_servers.omx_memory.tools.notepad_write_working]
approval_mode = "approve"

# OMX Code Intelligence MCP Server (LSP diagnostics, AST search)
[mcp_servers.omx_code_intel]
command = "node"
args = ["/usr/lib/node_modules/oh-my-codex/dist/mcp/code-intel-server.js"]
enabled = true
startup_timeout_sec = 10

[mcp_servers.omx_code_intel.tools.lsp_diagnostics]
approval_mode = "approve"

[mcp_servers.omx_code_intel.tools.lsp_servers]
approval_mode = "approve"

[mcp_servers.omx_code_intel.tools.lsp_diagnostics_directory]
approval_mode = "approve"

# OMX Trace MCP Server (agent flow timeline & statistics)
[mcp_servers.omx_trace]
command = "node"
args = ["/usr/lib/node_modules/oh-my-codex/dist/mcp/trace-server.js"]
enabled = true
startup_timeout_sec = 5

# OMX Team MCP Server (team job lifecycle: start, status, wait, cleanup)
[mcp_servers.omx_team_run]
command = "node"
args = ["/usr/lib/node_modules/oh-my-codex/dist/mcp/team-server.js"]
enabled = true
startup_timeout_sec = 5

[mcp_servers.omx_team_run.tools.omx_run_team_start]
approval_mode = "approve"

[mcp_servers.omx_team_run.tools.omx_run_team_status]
approval_mode = "approve"

# OMX TUI StatusLine (Codex CLI v0.101.0+)
[tui]
status_line = ["model-with-reasoning", "git-branch", "context-remaining", "total-input-tokens", "total-output-tokens", "five-hour-limit", "weekly-limit"]

[projects."/mnt/d/My/UnityProject/Project-VOID"]
trust_level = "trusted"

